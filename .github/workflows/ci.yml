name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crewcast_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Checks & Migrations
        env:
          SECRET_KEY: ci-test-secret-key-crewcast
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/crewcast_test_db
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
        run: |
          python manage.py check
          python manage.py migrate
          python manage.py collectstatic --noinput

      - name: Run Tests with PostgreSQL and Redis
        env:
          SECRET_KEY: ci-test-secret-key-crewcast
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/crewcast_test_db
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          CREWCAST_REQUIRE_EXTERNAL_SERVICES: "1"
        run: |
          pytest
